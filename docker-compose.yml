services:
  identity-svc:
    image: quay.io/keycloak/keycloak:26.1.1
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      DB_VENDOR: h2
      KEYCLOAK_IMPORT: /tmp/keycloak-realm.json
    volumes:
      - ./keycloak-data/keycloak-realm.json:/tmp/keycloak-realm.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "8080", "--https-port", "8443"]
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - local_network
networks:
  local_network:
    driver: bridge